<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 632' width='1200' height='632' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>
<rect width='1200' height='632' rx='18' fill='#0b1426'/>
<text x='60' y='48' font-size='26' font-weight='700' fill='#f4f1ea'>One session, step by step</text>
<text x='60' y='76' font-size='16' fill='#9aa6c0'>About 90 minutes for a person; the order matters more than the time</text>
<rect x='60' y='104' width='1080' height='52' rx='12' fill='#14213d'/><circle cx='92' cy='130' r='18' fill='#edb040'/><text x='92' y='136' font-size='17' font-weight='800' text-anchor='middle' fill='#0b1426'>1</text><text x='126' y='136' font-size='18' font-weight='700' fill='#f4f1ea'>Game 1</text><text x='300' y='136' font-size='16' fill='#f4f1ea'>Rapid 15+10 vs the FIDE-rated opponent at your level</text><text x='1120' y='136' font-size='14' text-anchor='end' fill='#edb040'>Play → Play at FIDE level</text><rect x='60' y='168' width='1080' height='52' rx='12' fill='#14213d'/><circle cx='92' cy='194' r='18' fill='#edb040'/><text x='92' y='200' font-size='17' font-weight='800' text-anchor='middle' fill='#0b1426'>2</text><text x='126' y='200' font-size='18' font-weight='700' fill='#f4f1ea'>Game 2</text><text x='300' y='200' font-size='16' fill='#f4f1ea'>The same, one level up</text><text x='1120' y='200' font-size='14' text-anchor='end' fill='#edb040'>Play → Play at FIDE level</text><rect x='60' y='232' width='1080' height='52' rx='12' fill='#14213d'/><circle cx='92' cy='258' r='18' fill='#edb040'/><text x='92' y='264' font-size='17' font-weight='800' text-anchor='middle' fill='#0b1426'>3</text><text x='126' y='264' font-size='18' font-weight='700' fill='#f4f1ea'>Review</text><text x='300' y='264' font-size='16' fill='#f4f1ea'>Find the turning point of each game</text><text x='1120' y='264' font-size='14' text-anchor='end' fill='#edb040'>Analyse → Report</text><rect x='60' y='296' width='1080' height='52' rx='12' fill='#14213d'/><circle cx='92' cy='322' r='18' fill='#edb040'/><text x='92' y='328' font-size='17' font-weight='800' text-anchor='middle' fill='#0b1426'>4</text><text x='126' y='328' font-size='18' font-weight='700' fill='#f4f1ea'>Course</text><text x='300' y='328' font-size='16' fill='#f4f1ea'>Course page → model game → trainer</text><text x='1120' y='328' font-size='14' text-anchor='end' fill='#edb040'>Learn → Openings → Courses</text><rect x='60' y='360' width='1080' height='52' rx='12' fill='#14213d'/><circle cx='92' cy='386' r='18' fill='#edb040'/><text x='92' y='392' font-size='17' font-weight='800' text-anchor='middle' fill='#0b1426'>5</text><text x='126' y='392' font-size='18' font-weight='700' fill='#f4f1ea'>One more thing</text><text x='300' y='392' font-size='16' fill='#f4f1ea'>Puzzles, Guru, endgames, database, masters, blindfold…</text><text x='1120' y='392' font-size='14' text-anchor='end' fill='#edb040'>Learn</text><rect x='60' y='424' width='1080' height='52' rx='12' fill='#14213d'/><circle cx='92' cy='450' r='18' fill='#edb040'/><text x='92' y='456' font-size='17' font-weight='800' text-anchor='middle' fill='#0b1426'>6</text><text x='126' y='456' font-size='18' font-weight='700' fill='#f4f1ea'>Games 3–4</text><text x='300' y='456' font-size='16' fill='#f4f1ea'>From the course’s line</text><text x='1120' y='456' font-size='14' text-anchor='end' fill='#edb040'>the course’s Play it</text><rect x='60' y='488' width='1080' height='52' rx='12' fill='#14213d'/><circle cx='92' cy='514' r='18' fill='#edb040'/><text x='92' y='520' font-size='17' font-weight='800' text-anchor='middle' fill='#0b1426'>7</text><text x='126' y='520' font-size='18' font-weight='700' fill='#f4f1ea'>Game 5</text><text x='300' y='520' font-size='16' fill='#f4f1ea'>A new opening from the catalogue, from move one</text><text x='1120' y='520' font-size='14' text-anchor='end' fill='#edb040'>Learn → Openings → Trainer</text><rect x='60' y='552' width='1080' height='52' rx='12' fill='#14213d'/><circle cx='92' cy='578' r='18' fill='#edb040'/><text x='92' y='584' font-size='17' font-weight='800' text-anchor='middle' fill='#0b1426'>8</text><text x='126' y='584' font-size='18' font-weight='700' fill='#f4f1ea'>Profile</text><text x='300' y='584' font-size='16' fill='#f4f1ea'>Read the numbers; the low one is next</text><text x='1120' y='584' font-size='14' text-anchor='end' fill='#edb040'>Profile → How you play</text>
</svg>